name: Generate Omnara Deep Research hero artwork

on:
  push:
    paths:
      - .github/workflows/capture-omnara-hero.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate and verify the raster artwork
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from io import BytesIO
          from pathlib import Path
          from urllib.parse import quote
          from urllib.request import Request, urlopen
          from PIL import Image, ImageOps, ImageFilter

          prompt = (
              "wide 16:9 text-free premium editorial information-art illustration of an inspectable deep-research "
              "campaign as a precise midnight-blue evidence cartography, one bright central inquiry anchor surrounded by "
              "nine distinct radial coverage sectors, many small source points connected by fine cyan provenance trails, "
              "a few amber deeply-read nodes with denser evidence halos, claim paths converging toward a compact bounded "
              "report form, several coral contradiction bridges held visibly unresolved, one deliberate empty coverage "
              "sector and several inaccessible dim points retained rather than erased, clear breadth-to-depth movement, "
              "subtle archival-paper and etched-glass textures, rigorous map-like geometry, restrained volumetric light, "
              "generous dark negative space, no people, no detective corkboard, no red string conspiracy board, no browser "
              "windows, no pile of tabs, no magnifying glass, no readable maps, no words, no letters, no logos, no charts "
              "with fake numbers, no dashboard, no database cylinder, no generic AI brain"
          )
          encoded = quote(prompt, safe='')
          urls = [
              f"https://pollinations.ai/p/{encoded}?width=1536&height=864&seed=2718281&nologo=true&enhance=true",
              f"https://image.pollinations.ai/prompt/{encoded}?width=1536&height=864&seed=2718281&nologo=true&enhance=true",
              f"https://gen.pollinations.ai/image/{encoded}?width=1536&height=864&seed=2718281&nologo=true",
          ]
          payload = None
          errors = []
          for url in urls:
              try:
                  req = Request(url, headers={
                      'User-Agent': 'Mozilla/5.0 (compatible; documentation-art-generator/1.0)',
                      'Accept': 'image/avif,image/webp,image/png,image/jpeg,*/*',
                  })
                  with urlopen(req, timeout=240) as response:
                      candidate = response.read()
                  probe = Image.open(BytesIO(candidate)); probe.verify()
                  if probe.width < 512 or probe.height < 288:
                      raise ValueError(f'image too small: {probe.size}')
                  payload = candidate
                  break
              except Exception as exc:
                  errors.append(f"{url.split('/')[2]}: {type(exc).__name__}: {exc}")
          if payload is None:
              raise SystemExit('All image routes failed:\n' + '\n'.join(errors))
          image = Image.open(BytesIO(payload)).convert('RGB')
          image = ImageOps.fit(image, (1600, 900), method=Image.Resampling.LANCZOS)
          image = image.filter(ImageFilter.UnsharpMask(radius=1.0, percent=55, threshold=3))
          output = Path('docs/assets/omnara-hero.png')
          output.parent.mkdir(parents=True, exist_ok=True)
          image.save(output, format='PNG', optimize=True)
          check = Image.open(output)
          if check.format != 'PNG' or check.size != (1600, 900) or output.stat().st_size < 100_000:
              raise SystemExit(f'Raster verification failed: {check.format} {check.size} {output.stat().st_size}')
          print(f'Verified {output}: PNG {check.width}x{check.height}, {output.stat().st_size} bytes')
          PY
      - name: Commit the asset and remove this workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/omnara-hero.png
          git rm .github/workflows/capture-omnara-hero.yml
          git commit -m "Add generated Omnara Deep Research hero artwork"
          git push
